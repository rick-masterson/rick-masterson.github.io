<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Guessing Game</h1>
    <p class="rules">
        Guess the three numbers, each from 0 to 9, all different. A box turns
        <span class="green">green</span> if its number is right,
        <span class="yellow">yellow</span> if the number is in another box, and
        <span class="red">red</span> if it is not in the sequence. You have ten guesses.
    </p>
    <h2>Guesses remaining: <span id="counter">10</span></h2>

    <div class="boxes">
        <input class="box" id="box1" type="text" inputmode="numeric" maxlength="1" aria-label="First number">
        <input class="box" id="box2" type="text" inputmode="numeric" maxlength="1" aria-label="Second number">
        <input class="box" id="box3" type="text" inputmode="numeric" maxlength="1" aria-label="Third number">
    </div>

    <p class="actions">
        <button type="button" id="submit">Check</button>
        <button type="button" id="restart" hidden>Play again</button>
    </p>
    <p id="message" role="status"></p>

    <p class="home"><a href="../">Back to projects</a></p>
    <script src="script.js"></script>
</body>

</html>
