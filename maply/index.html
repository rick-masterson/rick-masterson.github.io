<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maply</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@3.3.7/slate/bootstrap.min.css" integrity="sha384-RpX8okQqCyUNG7PlOYNybyJXYTtGQH+7rIKiVvg1DLg6jahLEk47VvpUyS+E2/uJ" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-default">
        <div class="container-fluid">
            <form class="navbar-form" id="search">
                <a class="navbar-brand" href="../">Maply</a>
                <input class="form-control" type="text" id="place" placeholder="City or zip code" required>
                <button type="submit" class="btn btn-default" aria-label="Add a map">
                    <span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
                </button>
                <span id="message" class="message" role="status"></span>
            </form>
        </div>
    </nav>

    <div class="container">
        <div class="row" id="cards"></div>
    </div>

    <template id="card-template">
        <div class="col-sm-6 col-md-4">
            <div class="card">
                <button type="button" class="btn btn-default btn-xs close-card" aria-label="Remove">
                    <span class="glyphicon glyphicon-minus" aria-hidden="true"></span>
                </button>
                <h4 class="place"></h4>
                <div class="map"></div>
            </div>
        </div>
    </template>

    <footer>
        Place search by <a href="https://open-meteo.com/">Open-Meteo.com</a>.
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
    <script src="jscript.js"></script>
</body>

</html>
