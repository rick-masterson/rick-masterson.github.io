<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="../assets/site.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <span class="path"><a href="../">~/rick-masterson</a> / <span class="here">weatherly</span></span>
    </header>

    <main class="page">
        <p class="eyebrow">Project</p>
        <h1>Weatherly</h1>
        <p class="lede">Current conditions and today's forecast for any city or zip code.</p>

        <form class="search" id="search">
            <input class="input" type="text" id="place" placeholder="City or zip code, e.g. 40202" required aria-label="City or zip code">
            <button type="submit" class="btn">Add city</button>
            <span id="message" class="status" role="status"></span>
        </form>

        <div class="cards" id="cards"></div>
        <p class="empty">No cities yet. Search above to add one.</p>
    </main>

    <template id="card-template">
        <article class="card weather">
            <button type="button" class="remove close-card" aria-label="Remove">×</button>
            <h3 class="place"></h3>
            <p class="meta time"></p>
            <div class="now">
                <img class="icon" alt="">
                <div>
                    <div class="temp"></div>
                    <div class="summary"></div>
                </div>
            </div>
            <dl class="stats">
                <div><dt>High</dt><dd class="high"></dd></div>
                <div><dt>Low</dt><dd class="low"></dd></div>
                <div><dt>Rain</dt><dd class="precip"></dd></div>
            </dl>
        </article>
    </template>

    <footer class="site-footer">
        Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a> (CC BY 4.0) ·
        Icons by <a href="http://www.dr-lex.be/software/darksky-icons.html">Dr. Lex</a> (CC BY 3.0)
    </footer>

    <script src="jscript.js"></script>
</body>

</html>
