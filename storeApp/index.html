<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Charlie's Organic Produce</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div id="wrapper">
        <header>
            <img src="images/logo.png" alt="Charlie's Organic Produce logo" class="logo">
            <h1>Charlie's Organic Produce!</h1>
        </header>

        <nav>
            <ul>
                <li><a class="active" href="#">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#order">Order</a></li>
                <li><a href="../">More projects</a></li>
            </ul>
        </nav>

        <div class="top">
            <img src="images/farmers-market.jpg" alt="Fresh produce at a farmers market" class="banner">
            <aside id="order">
                <img src="images/ordernow.jpeg" alt="Order now">
                <p>Call 1-555-555-5555 for special orders.</p>
            </aside>
        </div>

        <h2 id="products">Products</h2>
        <div class="product-grid">
            <figure class="product-box"><img src="images/beets.png" alt=""><figcaption>Beets</figcaption></figure>
            <figure class="product-box"><img src="images/blueberry.png" alt=""><figcaption>Blueberries</figcaption></figure>
            <figure class="product-box"><img src="images/corn.png" alt=""><figcaption>Corn</figcaption></figure>
            <figure class="product-box"><img src="images/coconut.png" alt=""><figcaption>Coconut</figcaption></figure>
            <figure class="product-box"><img src="images/tm_kale.png" alt=""><figcaption>Kale</figcaption></figure>
            <figure class="product-box"><img src="images/tm_framboise.png" alt=""><figcaption>Raspberries</figcaption></figure>
            <figure class="product-box"><img src="images/tm_patate-douce.png" alt=""><figcaption>Sweet potatoes</figcaption></figure>
            <figure class="product-box"><img src="images/tm_aubergine.png" alt=""><figcaption>Aubergine</figcaption></figure>
            <figure class="product-box"><img src="images/tm_bette-a-carde.png" alt=""><figcaption>Swiss chard</figcaption></figure>
        </div>
    </div>
</body>

</html>
