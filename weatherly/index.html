<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@3.3.7/slate/bootstrap.min.css" integrity="sha384-RpX8okQqCyUNG7PlOYNybyJXYTtGQH+7rIKiVvg1DLg6jahLEk47VvpUyS+E2/uJ" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-default">
        <div class="container-fluid">
            <form class="navbar-form" id="search">
                <a class="navbar-brand" href="../">Weatherly</a>
                <input class="form-control" type="text" id="place" placeholder="City or zip code" required>
                <button type="submit" class="btn btn-default" aria-label="Add a city">
                    <span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
                </button>
                <span id="message" class="message" role="status"></span>
            </form>
        </div>
    </nav>

    <div class="container">
        <div class="row" id="cards"></div>
    </div>

    <template id="card-template">
        <div class="col-sm-6 col-md-3">
            <div class="card">
                <button type="button" class="btn btn-default btn-xs close-card" aria-label="Remove">
                    <span class="glyphicon glyphicon-minus" aria-hidden="true"></span>
                </button>
                <h3 class="place"></h3>
                <img class="icon" alt="">
                <h4 class="summary"></h4>
                <h1 class="temp"></h1>
                <p class="high-low"></p>
                <p class="precip"></p>
                <small class="time"></small>
            </div>
        </div>
    </template>

    <footer>
        Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a> (CC BY 4.0).
        Icons by <a href="http://www.dr-lex.be/software/darksky-icons.html">Dr. Lex</a> (CC BY 3.0).
    </footer>

    <script src="jscript.js"></script>
</body>

</html>
